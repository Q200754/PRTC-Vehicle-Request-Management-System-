<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>วิทยาลัยเทคโนโลยีพระมหาไถ่ พัทยา | ยื่นคำร้องขอใช้รถ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --primary-color: #1e3a8a;
      --primary-hover: #1e40af;
      --bg-color: #f8fafc;
      --card-border: #e2e8f0;
    }
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: var(--bg-color);
      color: #334155;
    }
    .form-container {
      max-width: 880px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 40px;
      border-top: 6px solid var(--primary-color);
    }
    .form-header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 20px;
    }
    .form-header h4 {
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 6px;
    }
    .nav-btn-group .btn {
      border-radius: 20px;
      font-weight: 600;
      padding: 6px 16px;
      transition: all 0.2s ease;
    }
    .section-title {
      font-weight: 700;
      color: #0f172a;
      font-size: 1.05rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .custom-card-option {
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #ffffff;
    }
    .custom-card-option:hover {
      border-color: #93c5fd;
      background-color: #f0f9ff;
    }
    .form-check-input:checked + .custom-card-label {
      font-weight: 600;
      color: var(--primary-color);
    }
    .has-checked {
      border-color: var(--primary-color) !important;
      background-color: #eff6ff !important;
    }
    .btn-submit {
      background-color: var(--primary-color);
      border: none;
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 10px;
      padding: 14px;
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      background-color: var(--primary-hover);
    }
    @media (max-width: 576px) {
      .form-container { padding: 24px 18px; margin: 15px auto; }
    }
  </style>
</head>
<body>

<div class="container py-2">
  <div class="form-container">
    
    <!-- Dynamic Navigation Buttons -->
    <div class="d-flex justify-content-end gap-2 nav-btn-group mb-3">
      <button onclick="navigateTo('driver')" class="btn btn-outline-success btn-sm">
        <i class="bi bi-speedometer2 me-1"></i> สำหรับคนขับ
      </button>
      <button onclick="navigateTo('admin')" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-shield-lock-fill me-1"></i> ระบบแอดมิน
      </button>
    </div>

    <!-- Header Title -->
    <div class="form-header">
      <h4>วิทยาลัยเทคโนโลยีพระมหาไถ่ พัทยา</h4>
      <h5 class="text-muted fw-normal fs-6">แบบยื่นคำร้องขอใช้รถยนต์สถาบัน</h5>
    </div>

    <form id="vehicleRequestForm">
      
      <!-- 1. ข้อมูลผู้ขอใช้ -->
      <div class="mb-4">
        <div class="section-title"><i class="bi bi-person-circle text-primary"></i> ๑. ข้อมูลผู้ยื่นคำร้อง</div>
        <div class="row g-3">
          <div class="col-md-7">
            <label class="form-label small fw-bold">ชื่อ-นามสกุล ผู้ขอใช้ <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="fullname" required placeholder="ระบุชื่อ-นามสกุล">
          </div>
          <div class="col-md-5">
            <label class="form-label small fw-bold">ฝ่าย / แผนก <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="department" required placeholder="เช่น เทคโนโลยีสารสนเทศ">
          </div>
          <div class="col-12">
            <label class="form-label small fw-bold">วัตถุประสงค์การใช้งาน <span class="text-danger">*</span></label>
            <textarea class="form-control" name="objective" rows="2" required placeholder="ระบุรายละเอียดวัตถุประสงค์การเดินทาง"></textarea>
          </div>
        </div>
      </div>

      <!-- 2. กำหนดการเดินทาง -->
      <div class="mb-4">
        <div class="section-title"><i class="bi bi-calendar-event text-primary"></i> ๒. กำหนดการเดินทาง</div>
        <div class="row g-3">
          <div class="col-md-6">
            <div class="p-3 border rounded-3 bg-light">
              <span class="fw-bold text-dark d-block mb-2 small"><i class="bi bi-box-arrow-up-right me-1 text-primary"></i> ออกเดินทาง</span>
              <div class="row g-2">
                <div class="col-7">
                  <label class="small text-muted">วันที่</label>
                  <input type="date" class="form-control" name="startDate" id="startDate" required onchange="calculateDays()">
                </div>
                <div class="col-5">
                  <label class="small text-muted">เวลา</label>
                  <input type="time" class="form-control" name="startTime" required>
                </div>
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="p-3 border rounded-3 bg-light">
              <span class="fw-bold text-dark d-block mb-2 small"><i class="bi bi-box-arrow-in-down-left me-1 text-success"></i> เดินทางกลับ</span>
              <div class="row g-2">
                <div class="col-7">
                  <label class="small text-muted">วันที่</label>
                  <input type="date" class="form-control" name="endDate" id="endDate" required onchange="calculateDays()">
                </div>
                <div class="col-5">
                  <label class="small text-muted">เวลา</label>
                  <input type="time" class="form-control" name="endTime" required>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12">
            <div class="input-group">
              <span class="input-group-text bg-white fw-bold text-secondary">รวมระยะเวลาเดินทาง</span>
              <input type="number" class="form-control text-center fw-bold text-primary fs-5" name="durationDays" id="durationDays" placeholder="0" readonly>
              <span class="input-group-text bg-white fw-bold text-secondary">วัน</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. รายละเอียดการรับส่ง & ผู้ร่วมเดินทาง -->
      <div class="mb-4">
        <div class="section-title"><i class="bi bi-geo-alt text-primary"></i> ๓. การรับ-ส่ง และ จำนวนผู้ร่วมเดินทาง</div>
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label small fw-bold">ลักษณะการรับ-ส่ง <span class="text-danger">*</span></label>
            <div class="d-flex flex-wrap gap-2">
              <label class="custom-card-option flex-fill">
                <input class="form-check-input me-1" type="radio" name="tripType" value="ไปส่งเท่านั้น" required onchange="updateRadioHighlight(this)">
                <span class="custom-card-label small">ไปส่งเท่านั้น</span>
              </label>
              <label class="custom-card-option flex-fill">
                <input class="form-check-input me-1" type="radio" name="tripType" value="รับกลับเท่านั้น" onchange="updateRadioHighlight(this)">
                <span class="custom-card-label small">รับกลับเท่านั้น</span>
              </label>
              <label class="custom-card-option flex-fill">
                <input class="form-check-input me-1" type="radio" name="tripType" value="ไปส่งและรอรับกลับ" onchange="updateRadioHighlight(this)">
                <span class="custom-card-label small">รอรับกลับ</span>
              </label>
            </div>
          </div>

          <div class="col-md-4">
            <label class="form-label small fw-bold">ผู้ร่วมเดินทาง <span class="text-danger">*</span></label>
            <div class="input-group">
              <input type="number" class="form-control" name="passengerCount" min="1" value="1" required>
              <span class="input-group-text bg-white">คน</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. ตัวเลือกรถ & ผู้ขับ -->
      <div class="mb-4">
        <div class="section-title"><i class="bi bi-truck text-primary"></i> ๔. ยานพาหนะ และ กิจกรรม</div>
        <div class="row g-3">
          <div class="col-md-12">
            <label class="form-label small fw-bold">ประเภทรถที่ต้องการใช้ <span class="text-danger">*</span></label>
            <div class="d-flex flex-wrap gap-2">
              <label class="custom-card-option flex-fill text-center">
                <input class="form-check-input me-1" type="radio" name="vehicleType" value="รถตู้" required onchange="updateRadioHighlight(this)">
                <span class="custom-card-label"><i class="bi bi-bus-front me-1"></i> รถตู้</span>
              </label>
              <label class="custom-card-option flex-fill text-center">
                <input class="form-check-input me-1" type="radio" name="vehicleType" value="รถกระบะ" onchange="updateRadioHighlight(this)">
                <span class="custom-card-label"><i class="bi bi-truck me-1"></i> รถกระบะ</span>
              </label>
              <label class="custom-card-option flex-fill text-center">
                <input class="form-check-input me-1" type="radio" name="vehicleType" value="รถบัส" onchange="updateRadioHighlight(this)">
                <span class="custom-card-label"><i class="bi bi-terminal me-1"></i> รถบัส</span>
              </label>
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label small fw-bold">ผู้รับผิดชอบในการขับรถ <small class="text-muted">(ถ้ามีระบุ)</small></label>
            <input type="text" class="form-control" name="driverName" placeholder="ระบุชื่อผู้ขับรถ">
          </div>

          <div class="col-md-6">
            <label class="form-label small fw-bold">ประเภทกิจกรรม <span class="text-danger">*</span></label>
            <select class="form-select" name="activity" required>
              <option value="" selected disabled>-- เลือกกิจกรรม --</option>
              <option value="งานโรงเรียน">งานโรงเรียน</option>
              <option value="งานกิจกรรมอื่น ๆ">งานกิจกรรมอื่น ๆ</option>
              <option value="งานส่วนตัว">งานส่วนตัว</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="btnSubmit" class="btn btn-primary btn-submit w-100 shadow-sm mt-3">
        <i class="bi bi-send-fill me-2"></i> ยื่นคำร้องขอใช้รถยนต์
      </button>

    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwszE9zY8keM6n0YL-yXRKpfurNfxwxPGClM98Y7C8xiIQQQXppF605e54l2XEUDYLq/exec";

  // 🔄 Dynamic Navigation System
  function navigateTo(page) {
    const baseUrl = window.location.href.split('?')[0];
    if (page === 'home') {
      window.top.location.href = baseUrl;
    } else {
      window.top.location.href = baseUrl + '?p=' + page;
    }
  }

  function calculateDays() {
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    if (start && end) {
      const d1 = new Date(start);
      const d2 = new Date(end);
      if (d2 < d1) {
        Swal.fire('คำเตือน', 'วันที่เดินทางกลับต้องไม่อยู่ก่อนวันที่ออกเดินทาง', 'warning');
        document.getElementById('endDate').value = start;
        document.getElementById('durationDays').value = 1;
        return;
      }
      const diffTime = d2 - d1;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      document.getElementById('durationDays').value = diffDays > 0 ? diffDays : 1;
    }
  }

  function updateRadioHighlight(element) {
    const name = element.name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
      input.closest('.custom-card-option')?.classList.remove('has-checked');
    });
    if (element.checked) {
      element.closest('.custom-card-option')?.classList.add('has-checked');
    }
  }

  document.getElementById('vehicleRequestForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังบันทึกข้อมูล...';

    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-send-fill me-2"></i> ยื่นคำร้องขอใช้รถยนต์';
          if(res.success) {
            Swal.fire({
              icon: 'success',
              title: 'ยื่นคำร้องสำเร็จ!',
              text: 'รหัสคำร้องของคุณคือ: ' + res.requestId,
              confirmButtonColor: '#1e3a8a'
            });
            document.getElementById('vehicleRequestForm').reset();
            document.querySelectorAll('.custom-card-option').forEach(el => el.classList.remove('has-checked'));
            document.getElementById('durationDays').value = '';
          } else {
            Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: res.message });
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-send-fill me-2"></i> ยื่นคำร้องขอใช้รถยนต์';
          Swal.fire({ icon: 'error', title: 'System Error', text: err.toString() });
        })
        .submitRequest(data);
    } else {
      data.action = "submitRequest";
      fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(res => {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send-fill me-2"></i> ยื่นคำร้องขอใช้รถยนต์';
        if(res.success) {
          Swal.fire({
            icon: 'success',
            title: 'ยื่นคำร้องสำเร็จ!',
            text: 'รหัสคำร้องของคุณคือ: ' + res.requestId,
            confirmButtonColor: '#1e3a8a'
          });
          document.getElementById('vehicleRequestForm').reset();
          document.querySelectorAll('.custom-card-option').forEach(el => el.classList.remove('has-checked'));
          document.getElementById('durationDays').value = '';
        } else {
          Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: res.message });
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send-fill me-2"></i> ยื่นคำร้องขอใช้รถยนต์';
        Swal.fire({ icon: 'error', title: 'System Error', text: err.toString() });
      });
    }
  });
</script>
</body>
</html>
