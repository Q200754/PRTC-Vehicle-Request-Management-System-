<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>วิทยาลัยเทคโนโลยีพระมหาไถ่ พัทยา | แบบยื่นคำร้องขอใช้รถ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #eef2f6;
      color: #2b2b2b;
    }
    .form-container {
      max-width: 850px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      padding: 40px;
      border-top: 6px solid #1a568c;
      position: relative;
    }
    .form-header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #eef2f6;
      padding-bottom: 20px;
    }
    .form-header h4 {
      font-weight: 700;
      color: #1a568c;
      margin-bottom: 5px;
    }
    .form-header h5 {
      font-weight: 600;
      color: #4a5568;
    }
    .btn-admin-group {
      position: absolute;
      top: 20px;
      right: 20px;
    }
    .section-num {
      font-weight: 600;
      color: #1a568c;
    }
    .form-label {
      font-weight: 500;
      margin-bottom: 6px;
    }
    .radio-group-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 16px;
    }
    .form-check-input:checked {
      background-color: #1a568c;
      border-color: #1a568c;
    }
    .btn-submit {
      background-color: #1a568c;
      border: none;
      font-weight: 600;
      font-size: 1.1rem;
      border-radius: 8px;
      padding: 12px;
      transition: all 0.2s ease;
    }
    .btn-submit:hover {
      background-color: #13416c;
    }
    @media (max-width: 576px) {
      .btn-admin-group {
        position: static;
        display: flex;
        width: 100%;
        margin-bottom: 15px;
        justify-content: flex-end;
      }
      .form-container {
        padding: 20px;
        margin: 15px auto;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="form-container">
    
    <!-- ปุ่มสลับไปหน้า Driver และ Admin บน Google Apps Script -->
    <div class="d-flex gap-2 btn-admin-group">
      <a href="https://script.google.com/macros/s/AKfycbwszE9zY8keM6n0YL-yXRKpfurNfxwxPGClM98Y7C8xiIQQQXppF605e54l2XEUDYLq/exec?p=driver" 
         target="_self" 
         class="btn btn-outline-success btn-sm rounded-pill fw-bold">
        <i class="bi bi-card-checklist me-1"></i> สำหรับคนขับ
      </a>
      <a href="https://script.google.com/macros/s/AKfycbwszE9zY8keM6n0YL-yXRKpfurNfxwxPGClM98Y7C8xiIQQQXppF605e54l2XEUDYLq/exec?p=admin" 
         target="_self" 
         class="btn btn-outline-secondary btn-sm rounded-pill fw-bold">
        <i class="bi bi-shield-lock-fill me-1"></i> ระบบแอดมิน
      </a>
    </div>

    <!-- หัวข้อเอกสาร -->
    <div class="form-header mt-3 mt-sm-0">
      <h4>วิทยาลัยเทคโนโลยีพระมหาไถ่ พัทยา</h4>
      <h5>แบบยื่นคำร้องขอใช้รถ</h5>
    </div>

    <form id="vehicleRequestForm">
      
      <!-- ๑. ผู้ขอใช้ และ ฝ่าย -->
      <div class="row g-3 mb-3">
        <div class="col-md-7">
          <label class="form-label"><span class="section-num">๑. ผู้ขอใช้ (ชื่อ-นามสกุล)</span> <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="fullname" required placeholder="ระบุชื่อ-นามสกุล">
        </div>
        <div class="col-md-5">
          <label class="form-label"><span class="section-num">ฝ่าย</span> <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="department" required placeholder="ระบุฝ่าย / แผนก">
        </div>
      </div>

      <!-- ๒. เพื่อ (วัตถุประสงค์) -->
      <div class="mb-3">
        <label class="form-label"><span class="section-num">๒. เพื่อ</span> <span class="text-danger">*</span></label>
        <textarea class="form-control" name="objective" rows="2" required placeholder="ระบุวัตถุประสงค์ในการขอใช้รถ"></textarea>
      </div>

      <!-- ๓. กำหนดการเดินทาง -->
      <div class="mb-3">
        <label class="form-label"><span class="section-num">๓. กำหนดการเดินทาง</span></label>
        <div class="row g-3">
          <div class="col-md-6">
            <div class="p-3 border rounded bg-light">
              <span class="fw-bold text-secondary d-block mb-2">ออกเดินทาง</span>
              <div class="row g-2">
                <div class="col-7">
                  <label class="small text-muted">วันที่</label>
                  <input type="date" class="form-control" name="startDate" id="startDate" required onchange="calculateDays()">
                </div>
                <div class="col-5">
                  <label class="small text-muted">เวลา</label>
                  <input type="time" class="form-control" name="startTime" required>
                </div>
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="p-3 border rounded bg-light">
              <span class="fw-bold text-secondary d-block mb-2">เดินทางกลับ</span>
              <div class="row g-2">
                <div class="col-7">
                  <label class="small text-muted">วันที่</label>
                  <input type="date" class="form-control" name="endDate" id="endDate" required onchange="calculateDays()">
                </div>
                <div class="col-5">
                  <label class="small text-muted">เวลา</label>
                  <input type="time" class="form-control" name="endTime" required>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 mt-2">
            <div class="input-group">
              <span class="input-group-text bg-white fw-bold">รวมระยะเวลาเดินทาง</span>
              <input type="number" class="form-control" name="durationDays" id="durationDays" placeholder="0" readonly>
              <span class="input-group-text bg-white">วัน</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ๔. การรับ-ส่ง -->
      <div class="mb-3">
        <label class="form-label"><span class="section-num">๔. การรับ-ส่ง</span> <span class="text-danger">*</span></label>
        <div class="radio-group-box">
          <div class="form-check form-check-inline me-4">
            <input class="form-check-input" type="radio" name="tripType" id="trip1" value="ไปส่งเท่านั้น" required>
            <label class="form-check-label" for="trip1">ไปส่งเท่านั้น</label>
          </div>
          <div class="form-check form-check-inline me-4">
            <input class="form-check-input" type="radio" name="tripType" id="trip2" value="รับกลับเท่านั้น">
            <label class="form-check-label" for="trip2">รับกลับเท่านั้น</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="tripType" id="trip3" value="ไปส่งและรอรับกลับ">
            <label class="form-check-label" for="trip3">ไปส่งและรอรับกลับ</label>
          </div>
        </div>
      </div>

      <!-- ๕. จำนวนผู้ร่วมเดินทาง -->
      <div class="mb-3">
        <label class="form-label"><span class="section-num">๕. จำนวนผู้ร่วมเดินทาง</span> <span class="text-danger">*</span></label>
        <div class="input-group" style="max-width: 300px;">
          <input type="number" class="form-control" name="passengerCount" min="1" value="1" required>
          <span class="input-group-text bg-white">คน</span>
        </div>
      </div>

      <!-- ๖. รถที่ต้องการใช้ -->
      <div class="mb-3">
        <label class="form-label"><span class="section-num">๖. รถที่ต้องการใช้</span> <span class="text-danger">*</span></label>
        <div class="radio-group-box">
          <div class="form-check form-check-inline me-4">
            <input class="form-check-input" type="radio" name="vehicleType" id="v1" value="รถตู้" required>
            <label class="form-check-label" for="v1">รถตู้</label>
          </div>
          <div class="form-check form-check-inline me-4">
            <input class="form-check-input" type="radio" name="vehicleType" id="v2" value="รถกระบะ">
            <label class="form-check-label" for="v2">รถกระบะ</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="vehicleType" id="v3" value="รถบัส">
            <label class="form-check-label" for="v3">รถบัส</label>
          </div>
        </div>
      </div>

      <!-- ๗. ผู้รับผิดชอบในการขับรถ -->
      <div class="mb-3">
        <label class="form-label"><span class="section-num">๗. ผู้รับผิดชอบในการขับรถ</span> <small class="text-muted">(ถ้ามีระบุ)</small></label>
        <input type="text" class="form-control" name="driverName" placeholder="ระบุชื่อผู้ขับรถ (หรือเว้นไว้ให้แอดมินจัดสรร)">
      </div>

      <!-- ๘. กิจกรรมขอใช้รถ -->
      <div class="mb-4">
        <label class="form-label"><span class="section-num">๘. กิจกรรมขอใช้รถ</span> <span class="text-danger">*</span></label>
        <div class="radio-group-box">
          <div class="form-check form-check-inline me-4">
            <input class="form-check-input" type="radio" name="activity" id="act1" value="งานส่วนตัว" required>
            <label class="form-check-label" for="act1">งานส่วนตัว</label>
          </div>
          <div class="form-check form-check-inline me-4">
            <input class="form-check-input" type="radio" name="activity" id="act2" value="งานโรงเรียน">
            <label class="form-check-label" for="act2">งานโรงเรียน</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="activity" id="act3" value="งานกิจกรรมอื่น ๆ">
            <label class="form-check-label" for="act3">งานกิจกรรมอื่น ๆ</label>
          </div>
        </div>
      </div>

      <!-- ปุ่มส่งข้อมูล -->
      <button type="submit" id="btnSubmit" class="btn btn-primary btn-submit w-100 shadow-sm">
        ยื่นคำร้องขอใช้รถ
      </button>

    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwszE9zY8keM6n0YL-yXRKpfurNfxwxPGClM98Y7C8xiIQQQXppF605e54l2XEUDYLq/exec";

  function calculateDays() {
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    if (start && end) {
      const d1 = new Date(start);
      const d2 = new Date(end);
      const diffTime = d2 - d1;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      document.getElementById('durationDays').value = diffDays > 0 ? diffDays : 1;
    }
  }

  document.getElementById('vehicleRequestForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerText = 'กำลังบันทึกข้อมูล...';

    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerText = 'ยื่นคำร้องขอใช้รถ';
          if(res.success) {
            Swal.fire({
              icon: 'success',
              title: 'ยื่นคำร้องสำเร็จ!',
              text: 'รหัสคำร้องของคุณคือ: ' + res.requestId,
              confirmButtonColor: '#1a568c'
            });
            document.getElementById('vehicleRequestForm').reset();
            document.getElementById('durationDays').value = '';
          } else {
            Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: res.message });
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerText = 'ยื่นคำร้องขอใช้รถ';
          Swal.fire({ icon: 'error', title: 'System Error', text: err.toString() });
        })
        .submitRequest(data);
    } else {
      data.action = "submitRequest";
      fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(res => {
        btn.disabled = false;
        btn.innerText = 'ยื่นคำร้องขอใช้รถ';
        if(res.success) {
          Swal.fire({
            icon: 'success',
            title: 'ยื่นคำร้องสำเร็จ!',
            text: 'รหัสคำร้องของคุณคือ: ' + res.requestId,
            confirmButtonColor: '#1a568c'
          });
          document.getElementById('vehicleRequestForm').reset();
          document.getElementById('durationDays').value = '';
        } else {
          Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: res.message });
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerText = 'ยื่นคำร้องขอใช้รถ';
        Swal.fire({ icon: 'error', title: 'System Error', text: err.toString() });
      });
    }
  });
</script>
</body>
</html>
